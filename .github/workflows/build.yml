name: Build with licensed local pack inputs
on:
  workflow_dispatch:
    inputs:
      instance:
        description: Absolute path to the installed KNCraft profile on the private runner
        required: true
        type: string
jobs:
  forge:
    runs-on: [self-hosted, Windows, kncraft]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify local build dependencies
        env:
          KNCRAFT_INSTANCE: ${{ inputs.instance }}
        run: python tools/bootstrap_dependencies.py --instance "$env:KNCRAFT_INSTANCE"
      - run: .\gradlew.bat build harnessJars --console=plain
      - run: python tools/validate_artifact.py --jar build/libs/KNCraft-Architecture-0.2.0.jar
      - uses: actions/upload-artifact@v4
        with:
          name: KNCraft-Architecture
          path: build/libs/KNCraft-Architecture-*.jar
