plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '6.0.36'
}
version = project.mod_version
group = 'com.beautyinblocks.kncraft'
base { archivesName = 'KNCraftCompatibilityMod' }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
minecraft { mappings channel: 'official', version: '1.20.1' }
repositories { mavenCentral(); flatDir { dirs 'libs' } }
dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.0'
    implementation fg.deobf('local:immersiveportals:3.0.7')
    implementation fg.deobf('local:nomadictents:20.1.1')
    implementation fg.deobf('local:infiniverse:1.0.0.5')
    implementation fg.deobf('local:weather2:2.8.3')
    implementation fg.deobf('local:coldsweat:2.4.3')
    implementation fg.deobf('local:elytraslot:6.4.4')
    implementation fg.deobf('local:curios:5.14.1')
    implementation fg.deobf('local:bettercombat:1.9.0')
    implementation fg.deobf('local:sophisticatedcore:1.5.1.2335')
    implementation fg.deobf('local:patchouli:85')
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
jar {
    from('NOTICE.md')
    manifest { attributes 'MixinConfigs': 'kncrafttents.mixins.json,kncraftperformance.mixins.json,kncraftintegrations.mixins.json',
            'Implementation-Version': project.version }
    finalizedBy 'reobfJar'
}
test { useJUnitPlatform() }
tasks.register('validateResources', Exec) {
    dependsOn 'testRecipeTiers'
    commandLine 'python', 'tools/validate_artifact.py'
}

tasks.register('testRecipeTiers', Exec) {
    commandLine 'python', 'tools/test_thermal_complexity.py'
}
tasks.named('check') { dependsOn 'validateResources' }
['depth', 'tents', 'performance', 'cohesion', 'expansion'].each { module ->
    def source = sourceSets.create(module + 'Harness') {
        java.srcDir "src/gametest/${module}/java"
        resources.srcDir "src/gametest/${module}/resources"
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += output + compileClasspath
    }
    tasks.register(module + 'HarnessJar', Jar) {
        dependsOn source.classesTaskName
        archiveBaseName = 'KNCraft-' + module + '-ISOLATED-TESTS'
        from source.output
    }
    reobf.create(module + 'HarnessJar')
    tasks.named(module + 'HarnessJar') { finalizedBy 'reobf' + module.capitalize() + 'HarnessJar' }
}
tasks.register('harnessJars') { dependsOn 'depthHarnessJar', 'tentsHarnessJar', 'performanceHarnessJar', 'cohesionHarnessJar', 'expansionHarnessJar' }
tasks.register('releaseBundle', Zip) {
    dependsOn 'reobfJar', 'test', 'validateResources'
    archiveFileName = "KNCraftCompatibilityMod-${project.version}.zip"
    destinationDirectory = layout.buildDirectory.dir('distributions')
    from(tasks.jar) { into 'mods' }
    from('README.md', 'CHANGELOG.md', 'NOTICE.md')
    from('docs') { into 'docs' }
    from('pack-overrides') { into 'pack-overrides' }
    from('tools/migrate_guide.py') { into 'tools' }
}
