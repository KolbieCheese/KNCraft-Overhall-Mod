	"Hottest Time" = 6000
	#─────────────────────────────────────────────────────────────────────────//v
	# The time of day when the world is at its coldest, in ticks
	# └── 0 = sunrise, 6000 = noon, 12000 = sunset, 18000 = midnight
	#Range: 0 ~ 24000
	"Coldest Time" = 18000

